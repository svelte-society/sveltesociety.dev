name: Library submission

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'src/routes/(app)/(public)/submit/**'
      - 'src/lib/server/services/metadata.ts'
      - 'src/routes/(api)/api/preview/github/**'
      - 'tests/fixtures/library-preview.ts'
      - 'tests/e2e/content/submit-library.spec.ts'
      - 'tests/pages/SubmitPage.ts'
      - '.github/workflows/library-submission.yml'
  push:
    branches: [main, staging]
    paths:
      - 'src/routes/(app)/(public)/submit/**'
      - 'src/lib/server/services/metadata.ts'
      - 'src/routes/(api)/api/preview/github/**'
      - 'tests/fixtures/library-preview.ts'
      - 'tests/e2e/content/submit-library.spec.ts'
      - 'tests/pages/SubmitPage.ts'
      - '.github/workflows/library-submission.yml'

permissions:
  contents: read

jobs:
  library-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DB_PATH: test.db
      GITHUB_CLIENT_ID: test_client
      GITHUB_CLIENT_SECRET: test_secret
      GITHUB_AUTHORIZATION_CALLBACK_URL: http://localhost:4173/auth/callback
      SEED_DATABASE: none
      ANTHROPIC_API_KEY: mock_anthropic_key
      YOUTUBE_API_KEY: mock_youtube_key
      GITHUB_TOKEN: mock_github_token
      PLUNK_API_SECRET_KEY: mock_plunk_key
      PLUNK_API_URL: http://localhost:3001
      STRIPE_SECRET_KEY: sk_test_mock_stripe_key
      STRIPE_WEBHOOK_SECRET: whsec_mock_webhook_secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate SvelteKit aliases
        run: bunx svelte-kit sync
      - name: Test library preview initialization
        run: bun test 'src/routes/(app)/(public)/submit/submit-library.test.ts'
      - name: Test monorepo previews
        run: bun test 'src/routes/(api)/api/preview/github/github-preview.test.ts'
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test library submission in the browser
        run: bun run test:integration tests/e2e/content/submit-library.spec.ts
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-submission-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
