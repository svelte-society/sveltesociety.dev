worker_processes auto;
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # A browser's same-origin GET/HEAD fetch commonly omits Origin. Keep those
    # reads out of the shared crawler budget; per-client limits still apply.
    map "$request_method|$http_sec_fetch_site|$http_origin" $same_origin_read {
        ~^(GET|HEAD)\|same-origin\|$ 1;
        default 0;
    }

    log_format gateway escape=json
        '{"time":"$time_iso8601","client_ip":"$client_ip",'
        '"peer_ip":"$remote_addr","cf_connecting_ip":"$http_cf_connecting_ip",'
        '"cf_ray":"$http_cf_ray","method":"$request_method","uri":"$uri",'
        '"status":$status,"upstream_status":"$upstream_status",'
        '"limit_req_status":"$limit_req_status","limit_conn_status":"$limit_conn_status"}';
    access_log /var/log/nginx/access.log gateway;

    # Browser navigations and same-origin RPC calls remain usable while
    # non-browser floods share a strict global allowance.
    map "$same_origin_read|$request_method|$http_accept|$http_origin" $global_limit_key {
        ~^1\| "";
        ~^0\|GET\|.*text/html "";
        ~\|https://sveltesociety\.dev$ "";
        ~\|https://www\.sveltesociety\.dev$ "";
        default $server_name;
    }

    limit_req_zone $client_ip zone=per_ip:20m rate=10r/s;
    limit_req_zone $global_limit_key zone=global:1m rate=100r/s;
    limit_conn_zone $client_ip zone=per_ip_connections:20m;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_assets:20m max_size=256m inactive=1h use_temp_path=off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream svelte_app {
        server web:3000;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 20m;
        keepalive_timeout 30s;
        keepalive_requests 1000;

        # Only locally generated 429s use this handler. Upstream responses pass
        # through unchanged because proxy_intercept_errors remains off.
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "1" always;
            return 429 '{"error":"Too many requests"}';
        }

        location ^~ /api/webhooks/ {
            limit_conn per_ip_connections 50;
            proxy_pass http://svelte_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location ^~ /_app/immutable/ {
            limit_req zone=per_ip burst=200 nodelay;
            limit_conn per_ip_connections 50;
            proxy_cache static_assets;
            proxy_cache_valid 200 1h;
            proxy_pass http://svelte_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            limit_req zone=per_ip burst=100 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_conn per_ip_connections 50;

            proxy_pass http://svelte_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
