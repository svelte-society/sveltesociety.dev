worker_processes auto;
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Browser navigations and same-origin RPC calls remain usable while
    # non-browser floods share a strict global allowance.
    map "$request_method|$http_accept|$http_origin" $global_limit_key {
        ~^GET\|.*text/html "";
        ~\|https://sveltesociety\.dev$ "";
        ~\|https://www\.sveltesociety\.dev$ "";
        default $server_name;
    }

    limit_req_zone $client_ip zone=per_ip:20m rate=2r/s;
    limit_req_zone $global_limit_key zone=global:1m rate=30r/s;
    limit_conn_zone $client_ip zone=per_ip_connections:20m;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_assets:20m max_size=256m inactive=1h use_temp_path=off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream svelte_app {
        server web:3000;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 20m;
        keepalive_timeout 30s;
        keepalive_requests 1000;

        location ^~ /api/webhooks/ {
            limit_conn per_ip_connections 20;
            proxy_pass http://svelte_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location ^~ /_app/immutable/ {
            limit_req zone=per_ip burst=30 nodelay;
            limit_conn per_ip_connections 20;
            proxy_cache static_assets;
            proxy_cache_valid 200 1h;
            proxy_pass http://svelte_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            limit_req zone=per_ip burst=20 nodelay;
            limit_req zone=global burst=60 nodelay;
            limit_conn per_ip_connections 20;

            proxy_pass http://svelte_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
